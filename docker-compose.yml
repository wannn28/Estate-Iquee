# Hollis Row: Go API + MySQL 8. The SPA itself is static files served by the host's nginx,
# which also reverse-proxies /api/ to 127.0.0.1:${API_PORT}.
#   cp .env.example .env   # then fill in secrets (chmod 600)
#   docker compose up -d --build
name: iquee-estate

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --skip-name-resolve
    environment:
      MYSQL_DATABASE: estate
      MYSQL_USER: estate
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u estate -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # no "ports:" on purpose - the database is reachable only from the api container

  api:
    build:
      context: ./server
      args:
        VERSION: ${API_VERSION:-1.0.0}
    image: iquee-estate-api:${API_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_DSN: estate:${MYSQL_PASSWORD}@tcp(db:3306)/estate?parseTime=true&loc=UTC
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://estate.iquee.tech}
      ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@hollisrow.example}
      ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-hollis-demo}
      ADMIN_MASK_PII: ${ADMIN_MASK_PII:-true}
      RETENTION: ${RETENTION:-336h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-3006}:8080"   # loopback only; nginx is the public entry point
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logging

volumes:
  mysqldata:
